backend:
  name: github
  repo: DayOfTheHarvest/smgsj_cf
  branch: main
  base_url: https://sveltia-cms-auth.dncle02.workers.dev
  site_domain: www.smgsj.org
  auth_methods: [oauth]

# Pages + weekly presider roster. No approval flow, no roles (plan Sec 4).
# Staff hand-links new pages; header nav stays code-owned.
publish_mode: simple
media_folder: public/uploads
public_folder: /uploads
media_library:
  config:
    # URL-safe upload names (spaces/caps/accents become dashes/lowercase).
    slugify_filename: true
editorial_workflow: false
site_url: https://www.smgsj.org
app_title: St. Maria Goretti Parish
logo:
  src: /uploads/logo.png
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Three editing languages. Per-locale files (<name>.<locale>.json, <slug>.<locale>.md)
# with shared structure duplicated; missing text falls back to English (src/lib/i18n.ts).
i18n:
  structure: multiple_files
  locales: [en, es, vi]

# Full native toolbar for all richtext/markdown bodies (no free color picker).
# Fonts/colors only via custom editor components (Phase 2, optional).
field_defaults:
  richtext:
    buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
    editor_components: [image, code-block]
    modes: [rich_text, raw]

collections:

  - name: pages
    label: Pages
    label_singular: Page
    icon: article
    description: 'One file per topic (EN + ES + VI). Safe to edit text freely — you cannot break the site layout from here. Only rule: never change the page address. Switch languages with the locale switcher in the top-right corner.'
    folder: src/content/pages
    summary: '{{title}}'
    preview_path: '/en/{{slug}}'
    aliases_field: false
    i18n: true
    create: true # staff can add pages; filename comes from the page address below
    delete: false # never delete — hide by removing its menu link instead
    extension: md
    format: frontmatter
    slug: '{{slug_key}}'
    fields:
      - label: 'Page address (lowercase-with-dashes, e.g. new-ministry — set once, then never change)'
        name: slug_key
        widget: string
        required: true
        i18n: duplicate
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, numbers, and dashes only']
        hint: 'WARNING: this becomes the web address (/en/your-address/). Changing it later breaks links. Shared by all languages — edit in English only.'
      - label: 'Title (required in English, max 60 — other languages optional)'
        name: title
        widget: string
        i18n: true
        required: [en]
        hint: 'Shown in the header and Google results. Keep short. Empty translations show English.'
      - label: 'Page sections (the whole page, top to bottom)'
        name: sections
        widget: list
        i18n: duplicate
        required: false
        hint: 'Build the page from sections in any order. A section can have a heading, some text, and its own widgets below. Drag rows to reorder the page; delete a row to remove that part. Add, remove, or reorder rows in English only — other languages mirror the English layout (rows are read-only there).'
        types:
          - name: content_section
            label: Content section
            summary: '{{title}}'
            fields:
              - label: 'Section heading (this language, optional)'
                name: title
                widget: string
                i18n: true
                required: false
              - label: 'Section text (this language, optional)'
                name: body
                widget: markdown
                i18n: true
                required: false
                buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
                editor_components: [image, code-block]
                modes: [rich_text, raw]
              - label: 'Widgets in this section'
                name: blocks
                widget: list
                i18n: duplicate
                required: false
                hint: 'Widgets add special pieces to a section: thermometer, embed, button, text, image, or card. Drag to reorder. Add, remove, or reorder rows in English only (rows are read-only in other languages).'
                types:
                  - name: fundraiser
                    label: Fundraiser thermometer
                    summary: '{{title}}'
                    fields:
                      - label: 'Title (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - { label: 'Goal (dollars)', name: goal, widget: number, i18n: duplicate }
                      - { label: 'Raised so far (dollars)', name: pledged, widget: number, i18n: duplicate }
                      - { label: 'As of (date)', name: updated, widget: string, i18n: duplicate }
                      - { label: 'Donate link', name: donate_link, widget: string, i18n: duplicate }
                      - label: 'Donate button label (this language)'
                        name: donate_label
                        widget: string
                        i18n: true
                        required: false
                  - name: embed
                    label: Embed (calendar, video, map)
                    summary: '{{title}}'
                    fields:
                      - label: 'Title (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Embed URL'
                        name: url
                        widget: string
                        i18n: duplicate
                      - label: 'Height in pixels'
                        name: height
                        widget: number
                        i18n: duplicate
                        default: 1000
                        required: false
                      - label: 'Caption (optional, this language)'
                        name: caption
                        widget: string
                        i18n: true
                        required: false
                  - name: button
                    label: Button
                    summary: '{{label}}'
                    fields:
                      - label: 'Label (this language)'
                        name: label
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Link'
                        name: link
                        widget: string
                        i18n: duplicate
                        hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
                      - label: 'Color'
                        name: style
                        widget: select
                        i18n: duplicate
                        options: ['gold', 'light', 'primary', 'outline']
                  - name: richtext
                    label: Text block
                    summary: '{{body}}'
                    fields:
                      - label: 'Text (this language)'
                        name: body
                        widget: markdown
                        i18n: true
                        required: false
                        buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
                        editor_components: [image, code-block]
                        modes: [rich_text, raw]
                  - name: image
                    label: Image
                    summary: '{{alt}}'
                    fields:
                      - { label: 'Picture', name: image, widget: image, i18n: duplicate, required: false }
                      - label: 'Alt text (this language)'
                        name: alt
                        widget: string
                        i18n: true
                        required: false
                  - name: card
                    label: Card
                    summary: '{{title}}'
                    fields:
                      - label: 'Icon (pick from the list, optional)'
                        name: icon
                        widget: select
                        i18n: duplicate
                        options: ['users', 'church', 'star', 'calendar', 'heart', 'news', 'form', 'phone', 'mail', 'clock', 'info']
                        required: false
                      - label: 'Heading (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Text (this language)'
                        name: text
                        widget: markdown
                        i18n: true
                        required: false
                        buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
                        editor_components: [image, code-block]
                        modes: [rich_text, raw]
                      - label: 'Buttons (optional)'
                        name: buttons
                        widget: list
                        i18n: duplicate
                        required: false
                        summary: '{{label}}'
                        fields:
                          - label: 'Label (this language)'
                            name: label
                            widget: string
                            i18n: true
                            required: false
                          - label: 'Link'
                            name: link
                            widget: string
                            i18n: duplicate
                            hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
                          - label: 'Color'
                            name: style
                            widget: select
                            i18n: duplicate
                            options: ['gold', 'light', 'primary', 'outline']
                      - label: 'Buttons layout'
                        name: buttons_layout
                        widget: select
                        i18n: duplicate
                        options:
                          - { label: 'Stacked (one per line)', value: stacked }
                          - { label: 'Inline (side by side)', value: inline }
                        default: stacked
                        required: false
                  - name: staff
                    label: Staff Directory
          - name: fullwidth_section
            label: Full-width section
            summary: '{{title}}'
            fields:
              - label: 'Section heading (this language, optional)'
                name: title
                widget: string
                i18n: true
                required: false
              - label: 'Section text (this language, optional)'
                name: body
                widget: markdown
                i18n: true
                required: false
                buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
                editor_components: [image, code-block]
                modes: [rich_text, raw]
              - label: 'Widgets in this section'
                name: blocks
                widget: list
                i18n: duplicate
                required: false
                hint: 'Widgets add special pieces to a section: thermometer, embed, button, text, image, or card. Drag to reorder. Add, remove, or reorder rows in English only (rows are read-only in other languages).'
                types:
                  - name: fundraiser
                    label: Fundraiser thermometer
                    summary: '{{title}}'
                    fields:
                      - label: 'Title (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - { label: 'Goal (dollars)', name: goal, widget: number, i18n: duplicate }
                      - { label: 'Raised so far (dollars)', name: pledged, widget: number, i18n: duplicate }
                      - { label: 'As of (date)', name: updated, widget: string, i18n: duplicate }
                      - { label: 'Donate link', name: donate_link, widget: string, i18n: duplicate }
                      - label: 'Donate button label (this language)'
                        name: donate_label
                        widget: string
                        i18n: true
                        required: false
                  - name: embed
                    label: Embed (calendar, video, map)
                    summary: '{{title}}'
                    fields:
                      - label: 'Title (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Embed URL'
                        name: url
                        widget: string
                        i18n: duplicate
                      - label: 'Height in pixels'
                        name: height
                        widget: number
                        i18n: duplicate
                        default: 1000
                        required: false
                      - label: 'Caption (optional, this language)'
                        name: caption
                        widget: string
                        i18n: true
                        required: false
                  - name: button
                    label: Button
                    summary: '{{label}}'
                    fields:
                      - label: 'Label (this language)'
                        name: label
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Link'
                        name: link
                        widget: string
                        i18n: duplicate
                        hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
                      - label: 'Color'
                        name: style
                        widget: select
                        i18n: duplicate
                        options: ['gold', 'light', 'primary', 'outline']
                  - name: richtext
                    label: Text block
                    summary: '{{body}}'
                    fields:
                      - label: 'Text (this language)'
                        name: body
                        widget: markdown
                        i18n: true
                        required: false
                        buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
                        editor_components: [image, code-block]
                        modes: [rich_text, raw]
                  - name: image
                    label: Image
                    summary: '{{alt}}'
                    fields:
                      - { label: 'Picture', name: image, widget: image, i18n: duplicate, required: false }
                      - label: 'Alt text (this language)'
                        name: alt
                        widget: string
                        i18n: true
                        required: false
                  - name: card
                    label: Card
                    summary: '{{title}}'
                    fields:
                      - label: 'Icon (pick from the list, optional)'
                        name: icon
                        widget: select
                        i18n: duplicate
                        options: ['users', 'church', 'star', 'calendar', 'heart', 'news', 'form', 'phone', 'mail', 'clock', 'info']
                        required: false
                      - label: 'Heading (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Text (this language)'
                        name: text
                        widget: markdown
                        i18n: true
                        required: false
                        buttons: [bold, italic, strikethrough, code, link, heading-one, heading-two, heading-three, bulleted-list, numbered-list, quote]
                        editor_components: [image, code-block]
                        modes: [rich_text, raw]
                      - label: 'Buttons (optional)'
                        name: buttons
                        widget: list
                        i18n: duplicate
                        required: false
                        summary: '{{label}}'
                        fields:
                          - label: 'Label (this language)'
                            name: label
                            widget: string
                            i18n: true
                            required: false
                          - label: 'Link'
                            name: link
                            widget: string
                            i18n: duplicate
                            hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
                          - label: 'Color'
                            name: style
                            widget: select
                            i18n: duplicate
                            options: ['gold', 'light', 'primary', 'outline']
                      - label: 'Buttons layout'
                        name: buttons_layout
                        widget: select
                        i18n: duplicate
                        options:
                          - { label: 'Stacked (one per line)', value: stacked }
                          - { label: 'Inline (side by side)', value: inline }
                        default: stacked
                        required: false
                  - name: staff
                    label: Staff Directory
      - name: updated
        widget: hidden
        i18n: duplicate

  # ——— Masses: locations, languages, and the weekly schedule live here ———
  - divider: true

  - name: locations
    label: Mass Locations
    label_singular: Mass Location
    icon: location_on
    description: 'Add a location once, then pick it in the Mass list. Switch languages top-right to translate each place name.'
    file: src/data/locations.json
    identifier_field: key
    i18n: true
    summary: '{{key}} — {{name}}'
    fields:
      - label: 'Location code (lowercase-with-dashes, e.g. church — set once, then never change)'
        name: key
        widget: string
        i18n: duplicate
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, numbers, and dashes only']
        hint: 'WARNING: used behind the scenes to match Masses. Changing it later breaks Mass translations. Shared by all languages — edit in English only.'
      - label: 'Name (this language)'
        name: name
        widget: string
        i18n: true
        required: [en]
        hint: 'How this place reads in this language. Switch languages top-right to translate.'

  - name: mass_languages
    label: Mass Languages
    label_singular: Mass Language
    icon: translate
    description: 'Add a language once, then pick it in the Mass list. Names use autonyms so chips need no translation.'
    file: src/data/mass-languages.json
    identifier_field: code
    i18n: false
    summary: '{{autonym}}'
    fields:
      - label: 'Language code (lowercase, e.g. english — set once, then never change)'
        name: code
        widget: string
        i18n: duplicate
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, numbers, and dashes only']
        hint: 'WARNING: used behind the scenes to match Masses and filters. Changing it later breaks the schedule. Edit in English only.'
      - label: 'Name (autonym, e.g. English, Español, Tiếng Việt, Tagalog)'
        name: autonym
        widget: string
        i18n: duplicate
        required: true
        hint: 'How the language names itself — shown on chips and filters in every site language.'
      - label: 'Chip background color'
        name: color
        widget: color
        i18n: duplicate
        required: false
        allowInput: true
        hint: 'Pill background behind the language name on Mass filters and tables. Pick any color.'
      - label: 'Chip text color'
        name: text_color
        widget: color
        i18n: duplicate
        required: false
        allowInput: true
        hint: 'Text color on the chip. Pick a dark color on light backgrounds.'

  - name: schedule
    label: Mass Schedule & Presiders
    icon: calendar_month
    description: 'Weekly schedule. Each Mass row carries its own presider name, so nothing can silently mismatch.'
    i18n: true
    files:
      - name: masses
        label: Mass Times, Places & Presiders
        icon: event
        file: src/data/masses.json
        description: The 21 weekly Masses, each with its presider. Everything is picked from lists except names and times.
        fields:
          - label: 'Sunday schedule display (homepage Mass block)'
            name: display
            widget: object
            hint: 'Normally leave on Schedule. Pick Image for a special week to show an uploaded picture instead — switch back after.'
            fields:
              - label: 'Show'
                name: mode
                widget: select
                options: ['schedule', 'image']
              - { label: 'Picture (Media library)', name: image, widget: image, required: false }
              - { label: 'Picture link (optional)', name: link, widget: string, required: false }
          - label: 'Masses'
            name: masses
            widget: list
            collapsed: auto
            summary: "{{day}} {{time}} ({{lang}}) · {{presider | default('TBD')}}"
            hint: 'Pick day, language, and place from the lists. Do not add or remove rows without the web developer volunteer.'
            fields:
              - label: 'Service'
                name: service
                widget: select
                options: ['Saturday', 'Sunday', 'Weekday']
              - label: 'Day'
                name: day
                widget: select
                options: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Mon-Fri', '1st Friday']
              - label: 'Start time (e.g. 4:00pm)'
                name: time
                widget: string
                pattern: ['^\\d{1,2}:\\d{2}\\s?(am|pm|AM|PM)$', 'Time like 4:00pm']
                hint: 'Time only — the day comes from the Day picker above.'
              - label: 'Extra tag at the end (almost always leave blank — only for special cases like - Patio)'
                name: suffix
                widget: string
                required: false
              - label: 'Language'
                name: lang
                widget: relation
                collection: mass_languages
                value_field: code
                display_fields: [autonym]
                search_fields: [autonym]
                hint: 'Pick a language — add a new one under Mass languages first if missing.'
              - label: 'Place'
                name: location
                widget: relation
                collection: locations
                value_field: key
                display_fields: [name]
                search_fields: [name]
                hint: 'Pick a place — add a new one under Mass locations first if missing.'
              - label: 'Note (optional, e.g. Livestream)'
                name: note
                widget: string
                required: false
              - label: 'Presider for this Mass (e.g. Fr. Andrew — blank means TBD)'
                name: presider
                widget: string
                required: false
      - name: schedule-info
        label: Confession Text
        icon: notes
        file: src/data/schedule-info.{{locale}}.json
        i18n: true
        description: 'Confession day/time wording in this language — shown beside the Mass schedule. Switch languages top-right.'
        fields:
          - label: 'Confession'
            name: confession
            widget: object
            i18n: true
            required: false
            fields:
              - label: 'Day (e.g. Every Saturday)'
                name: day
                widget: string
                i18n: true
                required: false
              - label: 'Time (e.g. 3:00 PM – 3:45 PM)'
                name: time
                widget: string
                i18n: true
                required: false

  - name: bulletins
    label: Bulletins
    icon: description
    description: 'Weekly Sunday bulletin PDFs, newest first.'
    i18n: true
    files:
      - name: bulletin-list
        label: Bulletin Links
        file: src/data/bulletins.{{locale}}.json
        i18n: true
        description: Newest first. Upload the PDF via Media first, then paste its /uploads/ link here. Pick the Sunday date — the display label translates automatically.
        fields:
          - label: 'Show bulletins from the past N weeks (0 = show all)'
            name: weeks
            widget: number
            i18n: duplicate
            hint: 'The card stays short automatically — older bulletins drop off by date.'
          - label: 'Bulletins (newest first)'
            name: bulletins
            widget: list
            collapsed: auto
            label_singular: 'Bulletin'
            add_to_top: true
            i18n: duplicate
            summary: '{{date}}'
            fields:
              - label: 'Date (sets the auto-translated label below)'
                name: date
                widget: datetime
                i18n: duplicate
                hint: 'Pick the Sunday from the calendar. One shared date — display translates per language.'
              - label: 'Custom label (optional — blank = automatic translated date)'
                name: label
                widget: string
                i18n: true
                required: false
              - label: 'PDF link'
                name: url
                widget: string
                i18n: duplicate

  - name: homepage
    label: Homepage
    icon: home
    description: 'Everything on the homepage: welcome sections, action cards, and the rotating carousel.'
    i18n: true
    files:
      - name: homepage-text
        label: Homepage Welcome & Events
        icon: home
        file: src/data/homepage.{{locale}}.json
        i18n: true
        description: >-
          The homepage, top to bottom. Each row is a section with its own
          settings inside — open a row to edit it. Theme sections pull their
          content from their own files. Changing the pastor's words needs the
          pastor's approval first. Switch languages top-right;
          add/remove/reorder rows in English only.
        fields:
          - label: 'Homepage sections (order, visibility + content)'
            name: sections
            widget: list
            i18n: duplicate
            hint: 'Pick a row type when you add a row — the settings for that section live inside the row. Drag rows to reorder the homepage. Uncheck Visible to hide a section without deleting it (everything is kept). WARNING: never change a row type after filling it in — that clears the row. Add/remove rows in English only.'
            types:
              - name: preset
                label: Theme section
                summary: '{{id}}'
                fields:
                  - label: 'Section (content lives in its own file)'
                    name: id
                    widget: select
                    i18n: duplicate
                    options:
                      - { label: 'Carousel — rotating banner slides', value: carousel }
                      - { label: 'Actions — action cards row', value: actions }
                      - { label: 'Schedule — Mass times + schedule buttons', value: schedule }
                      - { label: 'Body — homepage page text', value: body }
                      - { label: 'Office — contact + office hours cards', value: office }
                      - { label: 'Flocknote — signup form', value: flocknote }
                  - label: 'Visible'
                    name: visible
                    widget: boolean
                    default: true
                    i18n: duplicate
              - name: hero
                label: Hero Banner
                summary: '{{title}}'
                fields:
                  - label: 'Visible'
                    name: visible
                    widget: boolean
                    default: true
                    i18n: duplicate
                  - label: 'Eyebrow line (small caps above title)'
                    name: eyebrow
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: 'Title (this language)'
                    name: title
                    widget: string
                    i18n: true
                    required: false
                  - label: 'Subtitle (this language)'
                    name: subtitle
                    widget: text
                    i18n: true
                    required: false
                  - label: 'Hero buttons'
                    name: buttons
                    widget: list
                    i18n: duplicate
                    summary: '{{label}}'
                    hint: 'WARNING: parish links must start AND end with / . A wrong link makes a dead button. Add/remove buttons in English only.'
                    fields:
                      - label: 'Label (this language)'
                        name: label
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Link'
                        name: link
                        widget: string
                        i18n: duplicate
                        hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
                      - label: 'Color'
                        name: style
                        widget: select
                        i18n: duplicate
                        options: ['gold', 'light', 'primary', 'outline']
                  - label: "Pastor's welcome quote (this language — needs the pastor's approval to change)"
                    name: pastor_quote
                    widget: text
                    i18n: true
                    required: false
              - name: events
                label: Event Cards
                summary: 'Event cards'
                fields:
                  - label: 'Visible'
                    name: visible
                    widget: boolean
                    default: true
                    i18n: duplicate
                  - label: 'Event cards'
                    name: events
                    widget: list
                    collapsed: auto
                    label_singular: 'Event'
                    i18n: duplicate
                    summary: '{{title}}'
                    hint: 'Add, remove or reorder cards in English only — other languages follow the same cards.'
                    fields:
                      - label: 'Icon (pick from the list)'
                        name: icon
                        widget: select
                        i18n: duplicate
                        options: ['users', 'church', 'star', 'calendar', 'heart', 'news', 'form', 'phone', 'mail', 'clock', 'info']
                        required: false
                      - label: 'Title (this language)'
                        name: title
                        widget: string
                        i18n: true
                        required: false
                      - label: 'Text (this language)'
                        name: text
                        widget: text
                        i18n: true
                        required: false
                      - label: 'Link (a parish page like /volunteer/, a full web address, or a @shortcut word — blank = no link)'
                        name: link
                        widget: string
                        required: false
                        i18n: duplicate
                        hint: 'WARNING: parish page addresses must start AND end with / . You can also type a @shortcut word (@giving @payment @calendar-suggest @calendar-view @flocknote @youtube) — those follow Site settings automatically. A wrong address makes a dead button. See “Contact Info & External Links” for what each @shortcut opens.'
                      - label: 'Link label (this language)'
                        name: link_label
                        widget: string
                        required: false
                        i18n: true
                  - label: 'Extra content (below the calendar buttons)'
                    name: blocks
                    widget: list
                    i18n: duplicate
                    required: false
                    hint: 'Text, buttons, thermometers, images, or embeds — anything a page section can hold. Drag to reorder. Add, remove, or reorder rows in English only (rows are read-only in other languages).'
                    types:
                      - name: fundraiser
