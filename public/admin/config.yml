  # ——— Site-wide settings ———
  - divider: true

  - name: site
    label: 'Site Settings — CAREFUL'
    icon: settings
    description: 'Contact info, office hours, and the signup form — changes here affect the whole site.'
    i18n: true
    files:
      - name: settings
        label: Contact Info & External Links
        icon: settings
        file: src/data/settings.json
        description: >-
          WARNING: these values appear in the header and footer of EVERY page.
          Phone, email, address, emergency numbers, Giving/Payment, Calendar,
          YouTube, Facebook, Flocknote. Double-check every character — a wrong
          link here breaks donations and contact site-wide.
          Link shortcuts staff can type in any link field: @giving (Online
          Giving), @payment (Online Payment), @calendar-suggest (Calendar
          request), @calendar-view (Calendar view), @flocknote (Flocknote
          signup), @youtube (YouTube channel) — each follows its URL on this
          screen automatically. A scannable copy lives on the
          Link Shortcuts page in this section.
        fields:
          - { label: 'Phone (e.g. 408-363-2300)', name: phone, widget: string }
          - { label: 'Header logo (pick from uploads)', name: logo, widget: image }
          - { label: 'Parish name (browser tabs, headers)', name: site_name, widget: string }
          - { label: 'Shrine address', name: shrine_address, widget: string }
          - { label: 'Email', name: email, widget: string }
          - { label: 'Address', name: address, widget: string }
          - label: 'Emergency numbers (add rows for future languages)'
            name: emergencies
            widget: list
            i18n: false
            collapsed: auto
            label_singular: 'Emergency Number'
            summary: '{{number}}'
            hint: 'One row per emergency line. Labels carry all three translations so numbers stay stored once.'
            fields:
              - label: 'Row code (lowercase-with-dashes, e.g. en-es — set once, never change)'
                name: id
                widget: string
                i18n: duplicate
                required: true
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, numbers, and dashes only']
              - label: 'Label (English)'
                name: label_en
                widget: string
                required: false
              - label: 'Label (Español)'
                name: label_es
                widget: string
                required: false
              - label: 'Label (Tiếng Việt)'
                name: label_vi
                widget: string
                required: false
              - label: 'Number (e.g. 408-363-2311)'
                name: number
                widget: string
                i18n: duplicate
                required: true
          - { label: 'Facility email', name: facility_email, widget: string }
          - { label: 'Online Giving URL', name: giving, widget: string }
          - { label: 'Online Payment URL', name: payment, widget: string }
          - { label: 'Calendar request URL', name: calendar_suggest, widget: string }
          - { label: 'Calendar view URL', name: calendar_view, widget: string }
          - label: 'Full-calendar embed URL (shown on the Calendar page)'
            name: calendar_embed
            widget: string
            hint: 'WARNING: must be the CalendarWiz embed link. A wrong URL shows a blank calendar.'
          - label: "Today's-events embed URL (shown on the Calendar page)"
            name: today_embed
            widget: string
            hint: 'WARNING: must be the CalendarWiz day-view embed link. A wrong URL shows a blank box.'
          - { label: 'YouTube channel URL', name: youtube, widget: string }
          - { label: 'Facebook page URL', name: facebook, widget: string }
          - { label: 'Flocknote signup URL', name: flocknote, widget: string }
          - { label: 'EthicsPoint report link', name: ethicspoint, widget: string }
          - { label: 'EthicsPoint phone', name: ethicspoint_phone, widget: string }
      - name: link-shortcuts
        label: Link Shortcuts
        icon: link
        file: src/data/link-shortcuts.json
        description: >-
          Reference only — nothing on this page changes the site. Type one of
          these shortcut words in any link field and the site inserts the
          matching URL from Contact Info & External Links automatically.
          Change the URL there and every shortcut using it updates site-wide.
        fields:
          - label: Shortcut Words
            name: shortcuts
            widget: text
            readonly: true
            default: |
              @giving — Online Giving. Uses the Online Giving URL.
              @payment — Online Payment. Uses the Online Payment URL.
              @calendar-suggest — Calendar request. Uses the Calendar request URL.
              @calendar-view — Calendar view. Uses the Calendar view URL.
              @flocknote — Flocknote signup. Uses the Flocknote signup URL.
              @youtube — YouTube channel. Uses the YouTube channel URL.
      - name: office-hours
        label: Office Hours
        file: src/data/office.{{locale}}.json
        i18n: true
        icon: business
        description: One place — updates the homepage Contact section, the footer on every page, and the contact page automatically. Switch languages top-right.
        fields:
          - label: 'Office hours (two lines: open days first, closed days second)'
            name: text
            widget: text
            i18n: true
            required: false
            hint: 'Example: Tuesday – Friday: 10:00 a.m. – 5:00 p.m.'
      - name: signup-form
        label: Signup Form
        icon: send
        file: src/data/signup-form.{{locale}}.json
        i18n: true
        description: 'Homepage signup block. Add, remove, or reorder fields with no code change. To switch services, change the Action URL below.'
        fields:
          - label: 'Heading (this language)'
            name: title
            widget: string
            i18n: true
            required: false
          - label: 'Explanation (this language)'
            name: text
            widget: text
            i18n: true
            required: false
          - label: 'Action URL (form posts here — do not change without the web developer volunteer)'
            name: action
            widget: string
            i18n: duplicate
            hint: 'WARNING: posts subscriptions to the parish group. A wrong URL silently sends signups nowhere.'
          - label: 'Method'
            name: method
            widget: select
            i18n: duplicate
            options: ['post', 'get']
            default: post
          - label: 'Target (where the result opens)'
            name: target
            widget: string
            i18n: duplicate
            default: _blank
            required: false
          - label: 'Fields (add, remove, or reorder — no code change needed)'
            name: fields
            widget: list
            i18n: duplicate
            collapsed: auto
            label_singular: 'Field'
            summary: '{{label}}'
            fields:
              - label: 'Field name (e.g. fname — set once, never change)'
                name: name
                widget: string
                i18n: duplicate
                required: true
                pattern: ['^[a-z0-9_]+$', 'Lowercase letters, numbers, and underscores only']
              - label: 'Label (this language)'
                name: label
                widget: string
                i18n: true
                required: false
              - label: 'Type'
                name: type
                widget: select
                i18n: duplicate
                options: ['text', 'email', 'tel', 'hidden', 'checkbox']
              - label: 'Required'
                name: required
                widget: boolean
                i18n: duplicate
                default: false
                required: false
              - label: 'Autocomplete (optional, e.g. given-name, family-name, email, tel)'
                name: autocomplete
                widget: string
                i18n: duplicate
                required: false
              - label: 'Default value (optional, for hidden fields)'
                name: value
                widget: string
                i18n: duplicate
                required: false
          - label: 'Submit button label (this language)'
            name: submit_label
            widget: string
            i18n: true
            required: false

