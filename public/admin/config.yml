# Single-entry files, top-level for one-click editing (header menu + staff directory).
# Paths unchanged so templates work untouched. Relations use collection _singletons.
singletons:
  - name: header-menu
    label: Header Menu
    icon: menu
    file: src/data/navigation.{{locale}}.json
    i18n: true
    description: >-
      WARNING: this is the header menu for the whole site. A wrong link
      breaks navigation everywhere; an empty label shows a blank menu item.
      Links must start AND end with / (e.g. /mass-times/). Add, remove or
      reorder menu items in English only — other languages follow the same
      items. Ask the web volunteer before changing the structure.
    fields:
      - label: 'Menu groups'
        name: groups
        widget: list
        collapsed: auto
        label_singular: 'Menu Group'
        i18n: duplicate
        summary: '{{label}}'
        fields:
          - label: 'Group code (leave alone — used behind the scenes)'
            name: id
            widget: string
            i18n: duplicate
          - label: 'Group name (this language)'
            name: label
            widget: string
            i18n: true
            required: false
          - label: 'Group link (e.g. /about-us/)'
            name: href
            widget: string
            i18n: duplicate
            hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
          - label: 'Submenu links'
            name: children
            widget: list
            label_singular: 'Link'
            i18n: duplicate
            summary: '{{label}}'
            fields:
              - label: 'Link name (this language)'
                name: label
                widget: string
                i18n: true
                required: false
              - label: 'Link (e.g. /staff/)'
                name: href
                widget: string
                i18n: duplicate
                hint: 'Parish pages, full URLs, or @shortcuts — see “Contact Info & External Links” for what each opens.'
  - name: staff
    label: Staff Members
    file: src/data/staff.{{locale}}.json
    i18n: true
    icon: group
    description: Names, roles, phone numbers, and bios. Photos are managed by the web developer volunteer. Write role and bio in this language — switch top-right.
    fields:
      - label: 'Members'
        name: members
        widget: list
        collapsed: auto
        label_singular: 'Member'
        i18n: duplicate
        summary: '{{name}}'
        thumbnail: photo
        fields:
          - label: 'Page code'
            name: slug
            widget: string
            i18n: duplicate
            hint: 'For a NEW person, type lowercase-with-dashes (e.g. maria-santos). Never change an existing code — profile links would break.'
          - label: 'Name'
            name: name
            widget: string
            i18n: duplicate
          - label: 'Role (this language)'
            name: role
            widget: string
            i18n: true
            required: false
          - label: 'Phone'
            name: phone
            widget: string
            i18n: duplicate
          - label: 'Photo'
            name: photo
            widget: image
            required: false
            i18n: duplicate
            hint: 'WARNING: do not change unless replacing the portrait. Use Choose image, never type a path.'
          - label: 'Bio (blank = no profile page link, this language)'
            name: bio
            widget: text
            required: false
            i18n: true
